# Secret con las variables de entorno de la aplicación.
#
# COMPLETAR antes de aplicar: reemplazar cada valor marcado con <COMPLETAR>
# con el valor real de .env. NO commitear este archivo con valores reales.
# Alternativa recomendada (no deja credenciales en el repo):
#   kubectl -n bunker4 create secret generic bunker4-env --from-env-file=.env \
#     --dry-run=client -o yaml | kubectl apply -f -
# y después omitir este archivo al aplicar.
apiVersion: v1
kind: Secret
metadata:
  name: bunker4-env
  namespace: bunker4
type: Opaque
stringData:
  # --- App ---
  APP_NAME: "Bunker4 Alumnos API"
  APP_ENV: "production"
  DEBUG: "false"

  # --- Database (PostgreSQL 16, externo al cluster) ---
  # Formato: postgresql+psycopg://user:pass@host:port/dbname
  DATABASE_URL: "postgresql+psycopg://<COMPLETAR_USUARIO>:<COMPLETAR_PASSWORD>@10.10.153.13:5432/bunker4_alumnos"

  # --- Security (JWT), compartido entre backend y frontend ---
  SECRET_KEY: "<COMPLETAR>"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  # --- CORS: orígenes del frontend (URL del NodePort del frontend) ---
  CORS_ORIGINS: "[\"http://<COMPLETAR_IP_NODO>:30080\"]"

  # --- Pagination ---
  DEFAULT_PAGE_SIZE: "20"
  MAX_PAGE_SIZE: "100"

  # --- Logging ---
  LOG_LEVEL: "INFO"

  # --- Frontend BFF ---
  BACKEND_URL: "http://backend:8000"

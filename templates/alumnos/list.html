{% extends "base.html" %}

{% block title %}Alumnos - Bunker4 Alumnos{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-content">
        <h1>Alumnos</h1>
        <button class="btn btn-primary" hx-get="/alumnos/nuevo" hx-target="#modal-container" hx-swap="innerHTML">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nuevo Alumno
        </button>
    </div>
    <div class="search-bar">
        <input type="search" id="search-input" placeholder="Buscar por DNI, nombre o apellido..." 
               hx-get="/alumnos/list" hx-trigger="keyup changed delay:300ms, search" 
               hx-target="#alumnos-table-body" hx-include="#activo-filter" hx-indicator="#search-spinner">
        <span class="htmx-indicator" id="search-spinner">⏳</span>
        <select id="activo-filter" hx-get="/alumnos/list" hx-trigger="change" hx-target="#alumnos-table-body" hx-include="#search-input">
            <option value="">Todos</option>
            <option value="true">Activos</option>
            <option value="false">Inactivos</option>
        </select>
    </div>
</div>

<div class="table-container">
    <table class="table">
        <thead>
            <tr>
                <th>DNI</th>
                <th>Nombre</th>
                <th>Email</th>
                <th>Teléfono</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="alumnos-table-body" hx-get="/alumnos/list" hx-trigger="load">
            <tr><td colspan="6" class="text-center">Cargando...</td></tr>
        </tbody>
    </table>
</div>

<div id="modal-container"></div>

<script>
    document.addEventListener('htmx:afterSwap', (evt) => {
        if (evt.detail.target.id === 'alumnos-table-body') {
            initTableActions();
        }
    });

    function initTableActions() {
        document.querySelectorAll('[data-delete-alumno]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (!confirm('¿Dar de baja a este alumno? Se desactivarán sus inscripciones.')) {
                    e.preventDefault();
                }
            });
        });
    }
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Dashboard - Bunker4 Alumnos{% endblock %}

{% block content %}
<div class="dashboard">
    <div class="dashboard-header">
        <h1>Dashboard</h1>
        <div class="dashboard-header-actions">
            <p class="dashboard-subtitle" x-text="'Bienvenido, ' + $store.auth.userName"></p>
            <button class="btn btn-ghost btn-sm" @click="$store.auth.logout()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></path>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Cerrar sesión
            </button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="dashboard-card" x-show="$store.auth.userRole === 'admin'">
            <div class="card-icon">👥</div>
            <h3>Alumnos</h3>
            <p class="card-count" id="alumnos-count"></p>
            <a href="/alumnos" class="btn btn-secondary btn-sm" hx-boost="true">Ver todos</a>
        </div>

        <div class="dashboard-card" x-show="$store.auth.userRole === 'admin'">
            <div class="card-icon">📚</div>
            <h3>Cursos</h3>
            <p class="card-count" id="cursos-count"></p>
            <a href="/cursos" class="btn btn-secondary btn-sm" hx-boost="true">Ver todos</a>
        </div>

        <div class="dashboard-card" x-show="$store.auth.userRole === 'admin' || $store.auth.userRole === 'docente'">
            <div class="card-icon">📝</div>
            <h3>Inscripciones</h3>
            <p class="card-count" id="inscripciones-count"></p>
            <a href="/cursos" class="btn btn-secondary btn-sm" hx-boost="true">Gestionar</a>
        </div>

        <div class="dashboard-card" x-show="$store.auth.userRole === 'alumno'">
            <div class="card-icon">🎓</div>
            <h3>Mis Cursos</h3>
            <p class="card-count" id="mis-cursos-count"></p>
            <a href="#" hx-get="/api/v1/alumno/me/cursos" hx-target="#mis-cursos-modal" hx-swap="innerHTML" class="btn btn-secondary btn-sm">Ver</a>
        </div>

        <div class="dashboard-card" x-show="$store.auth.userRole === 'docente'">
            <div class="card-icon">👨‍🏫</div>
            <h3>Mis Cursos (Docente)</h3>
            <p class="card-count" id="docente-cursos-count"></p>
            <a href="#" hx-get="/api/v1/docente/me/cursos" hx-target="#docente-cursos-modal" hx-swap="innerHTML" class="btn btn-secondary btn-sm">Ver</a>
        </div>
    </div>

    <div class="dashboard-recent" x-show="$store.auth.userRole === 'admin'">
        <h2>Actividad Reciente</h2>
        <div id="recent-activity" hx-get="/api/v1/admin/recent-activity" hx-trigger="load, every30s"></div>
    </div>
</div>

<div id="mis-cursos-modal"></div>
<div id="docente-cursos-modal"></div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        if ($store.auth.isAuthenticated) {
            loadDashboardStats();
        }
    });

    async function loadDashboardStats() {
        try {
            if ($store.auth.userRole === 'admin') {
                const [alumnos, cursos, inscripciones] = await Promise.all([
                    fetch('/api/v1/alumnos?limit=1', { headers: authHeaders() }).then(r => r.json()),
                    fetch('/api/v1/cursos?limit=1', { headers: authHeaders() }).then(r => r.json()),
                    fetch('/api/v1/inscripciones?limit=1', { headers: authHeaders() }).then(r => r.json())
                ]);
                document.getElementById('alumnos-count').textContent = formatCount(alumnos.total, 'alumno');
                document.getElementById('cursos-count').textContent = formatCount(cursos.total, 'curso');
                document.getElementById('inscripciones-count').textContent = formatCount(inscripciones.total, 'inscripción');
            } else if ($store.auth.userRole === 'alumno') {
                const res = await fetch('/api/v1/alumno/me/cursos', { headers: authHeaders() });
                const data = await res.json();
                const count = data.cursos?.length || 0;
                document.getElementById('mis-cursos-count').textContent = formatCount(count, 'curso');
            } else if ($store.auth.userRole === 'docente') {
                const res = await fetch('/api/v1/docente/me/cursos', { headers: authHeaders() });
                const data = await res.json();
                const count = data.cursos?.length || 0;
                document.getElementById('docente-cursos-count').textContent = formatCount(count, 'curso');
            }
        } catch (e) {
            console.error('Error loading dashboard stats', e);
        }
    }

    function formatCount(count, singular) {
        if (count === 0) return '';
        const plural = singular === 'inscripción' ? 'inscripciones' : singular + 's';
        return `${count} ${count === 1 ? singular : plural}`;
    }

    function authHeaders() {
        const token = localStorage.getItem('auth_token');
        return token ? { 'Authorization': `Bearer ${token}` } : {};
    }
</script>
{% endblock %}
